# Blueprint do Render (https://render.com): New > Blueprint > selecionar este repositório.
# Sobe a imagem do Dockerfile como um único serviço web: painel + agendador + modo demonstração.
services:
  - type: web
    name: zeladoria-cv
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: DEMO_SEED_PER_RUN
        value: "1"
      - key: PIPELINE_INTERVAL_SECONDS
        value: "60"
      # fotos novas do Mapillary por execução: no plano free (0,1 CPU, 512 MB) cada foto leva
      # ~5 s; com 10 por execução o servidor passa o tempo todo processando e o painel trava
      - key: MAPILLARY_LIMIT
        value: "3"
      # imagens guardadas; ao passar do limite, saem primeiro as sem dano (mais antigas antes)
      - key: MAX_IMAGES
        value: "200"
      # Preencher no painel do Render (não versionar segredos):
      - key: MAPILLARY_TOKEN
        sync: false
      - key: MAPILLARY_BBOX
        sync: false
      - key: WEBHOOK_URL
        sync: false
